name: Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - electron/**
      - scripts/*desktop.mjs
      - src/**
      - public/**
      - index.html
      - vite.config.ts
      - electron-builder.yml
      - package.json
      - bun.lock
      - .github/workflows/desktop.yml

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run desktop:test:unit
      - run: bun run desktop:pack
      - name: Install Linux window manager for fullscreen verification
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openbox
      - name: Verify Linux package
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' sh -c 'openbox --sm-disable & bun run desktop:test --no-sandbox --executable release/linux-unpacked/Sangota'
      - name: Verify Windows package
        if: runner.os == 'Windows'
        run: bun run desktop:test --executable release/win-unpacked/Sangota.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots-${{ runner.os }}
          path: artifacts/desktop/
          if-no-files-found: ignore
      - name: Archive Linux package with executable permissions
        if: runner.os == 'Linux'
        run: tar -czf release/Sangota-linux-x64.tar.gz -C release/linux-unpacked .
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: sangota-${{ runner.os }}
          path: release/*-unpacked/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: sangota-${{ runner.os }}
          path: release/Sangota-linux-x64.tar.gz
          retention-days: 7
