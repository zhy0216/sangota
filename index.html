<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三国 · 杀戮尖塔</title>
    <style>
      :root {
        --ink: #0d0b09;
        --paper: #e8dcc0;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        color: var(--paper);
        font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        /* faint rice-paper vignette behind the canvas */
        background:
          radial-gradient(ellipse at 50% 40%, #1c1814 0%, #0d0b09 70%);
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
        image-rendering: auto;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
